# https://www.playframework.com/documentation/latest/Configuration

# Loads .env (if present) so ${?VAR} below resolves from it as well as the
# real environment. See app/utils/DotenvApplicationLoader.scala.
play.application.loader = "utils.DotenvApplicationLoader"

# Redis-backed implementation of Play's cache API (SyncCacheApi / AsyncCacheApi).
# https://github.com/KarelCemus/play-redis
play.modules.enabled += "play.api.cache.redis.RedisCacheModule"

play.cache.redis {
  host = "localhost"
  host = ${?REDIS_HOST}
  port = 6379
  port = ${?REDIS_PORT}
}

db.default {
  url = "jdbc:postgresql://"${?DATABASE_HOST}":"${DATABASE_PORT}"/"${TEST_DATABASE_NAME}
  url = ${?DB_URL}
  username = "auctionite"
  username = ${?DATABASE_USER}
  password = "auctionite"
  password = ${?DATABASE_PASSWORD}
  driver = "org.postgresql.Driver"
  name = "auctionite_test"
  name = {?TEST_DATABASE_NAME}
}