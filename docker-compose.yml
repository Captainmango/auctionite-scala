# Values come from .env (copy .env.example). Note: POSTGRES_* only apply on
# first init of the volume — after changing them run `docker compose down -v`.
services:
  db:
    image: postgres:18-alpine
    container_name: auctionite-db
    environment:
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
      DB_PORT: ${DATABASE_PORT:?set DATABASE_PORT in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.10-alpine
    container_name: auctionite_cache
    ports:
      - "${REDIS_PORT:-6379}:6379"


volumes:
  pgdata:
